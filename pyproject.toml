[project]
name = "custom-ai-agent"
version = "0.1.0"
description = "Production Ready AI Agent using FastAPI, LangGraph and Ollama"
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    # ----------------------------
    # FastAPI
    # ----------------------------
    "fastapi>=0.121.0",
    "uvicorn[standard]>=0.35.0",
    "python-multipart>=0.0.30",
    "aiofiles>=24.1.0",

    # ----------------------------
    # Validation
    # ----------------------------
    "pydantic[email]>=2.11.1",
    "pydantic-settings>=2.8.1",
    "email-validator>=2.2.0",

    # ----------------------------
    # Database
    # ----------------------------
    "sqlmodel>=0.0.24",
    "psycopg[binary]>=3.2.9",
    "langgraph-checkpoint-postgres>=3.0.1",

    # ----------------------------
    # Authentication
    # ----------------------------
    "PyJWT[crypto]>=2.10.1",
    "bcrypt>=4.3.0",
    "passlib[bcrypt]>=1.7.4",

    # ----------------------------
    # AI
    # ----------------------------
    "langchain>=1.0.5",
    "langchain-core>=1.0.4",
    "langchain-community>=0.4.1",
    "langchain-openai>=1.0.2",
    "langchain-ollama>=1.0.0",
    "langchain-postgres>=0.0.12",
    "langgraph>=1.0.2",
    "langfuse==3.9.1",

    # ----------------------------
    # Memory
    # ----------------------------
    "mem0ai>=1.0.0",

    # ----------------------------
    # Search
    # ----------------------------
    "ddgs>=9.6.0",

    # ----------------------------
    # Documents
    # ----------------------------
    "pypdf>=5.9.0",

    # ----------------------------
    # ML
    # ----------------------------
    "transformers>=4.57.0",

    # ----------------------------
    # Logging
    # ----------------------------
    "structlog>=25.2.0",
    "colorama>=0.4.6",
    "tqdm>=4.67.1",

    # ----------------------------
    # Async
    # ----------------------------
    "asgiref>=3.8.1",
    "uvloop>=0.22.1",
    "tenacity>=9.1.2",

    # ----------------------------
    # HTTP
    # ----------------------------
    "aiohttp>=3.12.15",

    # ----------------------------
    # Monitoring
    # ----------------------------
    "prometheus-client>=0.23.1",
    "prometheus-fastapi-instrumentator>=7.1.0",

    # ----------------------------
    # Security
    # ----------------------------
    "slowapi>=0.1.9",

    # ----------------------------
    # Utilities
    # ----------------------------
    "python-dotenv>=1.1.1",

    # ----------------------------
    # Optional Backend
    # ----------------------------
    "supabase>=2.15.0",
]

[project.optional-dependencies]
dev = [
    "black>=25.1.0",
    "ruff>=0.12.8",
    "isort>=6.0.1",
    "flake8>=7.2.0",
    "djlint==1.36.4",
]

[dependency-groups]
test = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow"
]
python_files = [
    "test_*.py",
    "*_test.py",
    "tests.py",
]

[tool.black]
line-length = 119
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 119

[tool.ruff]
line-length = 119
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "B",
    "I",
]

ignore = [
    "E501",
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]